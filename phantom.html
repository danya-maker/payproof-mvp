```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Phantom — PayProof</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 20%, #123c70 0%, #071321 45%, #030811 100%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: min(420px, 90%);
      padding: 40px 30px;
      border: 1px solid #1687ff55;
      border-radius: 24px;
      background: #071525dd;
      box-shadow: 0 20px 60px #0008;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      color: #9eb7d0;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
      color: #8ebeff;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="logo">👻</div>

    <h1>Connect Phantom</h1>

    <p id="message">
      Connect your Phantom wallet to continue to PayProof.
    </p>

    <button id="connectBtn">
      Connect Phantom
    </button>

    <div id="status"></div>
  </div>

<script>
const RETURN_URL = "./index.html";

function getPhantom() {
  if (window.phantom?.solana?.isPhantom) {
    return window.phantom.solana;
  }

  if (window.solana?.isPhantom) {
    return window.solana;
  }

  return null;
}

async function connectPhantom() {

  const provider = getPhantom();

  // Phantom extension is not installed
  if (!provider) {

    document.getElementById("status").textContent =
      "Phantom is not installed. Opening Phantom...";

    // Open official Phantom website
    window.open(
      "https://phantom.app/",
      "_blank",
      "noopener,noreferrer"
    );

    return;
  }

  try {

    document.getElementById("status").textContent =
      "Opening Phantom...";

    const response = await provider.connect();

    const publicKey =
      response?.publicKey ||
      provider.publicKey;

    if (!publicKey) {
      throw new Error("Wallet address was not returned.");
    }

    const address = publicKey.toString();

    // Save address so index.html can read it
    localStorage.setItem(
      "payproof_wallet",
      address
    );

    document.getElementById("status").textContent =
      "Connected: " +
      address.slice(0, 6) +
      "..." +
      address.slice(-6);

    document.getElementById("message").textContent =
      "Phantom connected successfully.";

    document.getElementById("connectBtn").textContent =
      "Continue to PayProof";

    document.getElementById("connectBtn").onclick = () => {
      window.location.href = RETURN_URL;
    };

  } catch (error) {

    console.error(error);

    if (error?.code === 4001) {
      document.getElementById("status").textContent =
        "Connection was cancelled in Phantom.";
    } else {
      document.getElementById("status").textContent =
        "Could not connect to Phantom.";
    }
  }
}

document
  .getElementById("connectBtn")
  .addEventListener("click", connectPhantom);


// Automatically try Phantom when this page opens
window.addEventListener("load", () => {

  const provider = getPhantom();

  if (provider) {
    setTimeout(() => {
      connectPhantom();
    }, 500);
  }

});
</script>

</body>
</html>
